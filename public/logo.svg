<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Tablet Frame with Soft Jade Rounded Edges -->
  <rect x="18" y="24" width="64" height="66" rx="14" fill="#ffffff" stroke="#059669" stroke-width="4.5" />
  
  <!-- Screen Area -->
  <rect x="25" y="32" width="50" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
  
  <!-- POS receipt/graph lines on screen -->
  <path d="M33 42H55" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M33 50H67" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <path d="M33 58H48" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  
  <!-- Tablet Home Bar / Indicator -->
  <rect x="42" y="80" width="16" height="3" rx="1.5" fill="#059669" />

  <!-- Chef Hat on Top of Tablet (Line-Art & Modern Touch) -->
  <g transform="translate(0, -3)">
    <!-- Chef Hat Base Band -->
    <rect x="34" y="21" width="32" height="6.5" rx="3" fill="#ffffff" stroke="#059669" stroke-width="3.5" />
    
    <!-- Chef Hat Puffs -->
    <path d="M35 21C31 16 33 8 41 8C43.5 8 46.5 9.5 48 12C50 7.5 56 6.5 60 10C64.5 13.5 64 18 63 21" 
          fill="#ecfdf5" 
          stroke="#059669" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Decorative Center Hat Fold -->
    <path d="M49 13V20" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
